
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#fff9e6">
  <title>第65回椙大祭 WEBパンフレット</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: sans-serif;
      background: #fff9e6;
      color: #333;
    }

    body {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      flex: 0 0 auto;
      padding: 8px 12px;
      text-align: center;
      background: #fff3c7;
    }

    header h1 {
      margin: 0;
      font-size: 16px;
    }

    header p {
      margin: 3px 0 0;
      font-size: 11px;
    }

    #viewer {
      flex: 1;
      min-height: 0;
      overflow: auto;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 4px;
      background: #e9e7e0;
      overscroll-behavior: contain;
    }

    #pdfCanvas {
      display: block;
      background: white;
      box-shadow: 0 1px 5px #0002;
    }

    #controls {
      flex: 0 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 8px 6px;
      background: #fff3c7;
    }

    button, input {
      font: inherit;
      min-height: 38px;
      border: 1px solid #cdbb8b;
      border-radius: 7px;
      background: white;
      color: #44351d;
    }

    button {
      padding: 6px 12px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    #pageInput {
      width: 54px;
      min-height: 36px;
      text-align: center;
    }

    #pageTotal {
      font-size: 13px;
      white-space: nowrap;
    }

    #zoomLabel {
      font-size: 12px;
      min-width: 42px;
      text-align: center;
    }

    #status {
      font-size: 12px;
      text-align: center;
      padding: 5px;
      background: #fff9e6;
    }

    @media (max-width: 420px) {
      header {
        padding: 6px;
      }

      #controls {
        gap: 5px;
        padding: 6px 3px;
      }

      button {
        padding: 5px 9px;
        min-height: 36px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>第65回椙大祭</h1>
    <p>Re.Start｜WEB PAMPHLET</p>
  </header>

  <main id="viewer" aria-label="パンフレット表示領域">
    <canvas id="pdfCanvas"></canvas>
  </main>

  <nav id="controls" aria-label="ページ操作">
    <button id="prevBtn" type="button">◀ 前へ</button>

    <label for="pageInput" style="font-size:13px">
      ページ
    </label>
    <input id="pageInput" type="number"
           min="1" value="1" inputmode="numeric">
    <span id="pageTotal">/ --</span>

    <button id="nextBtn" type="button">次へ ▶</button>
    <button id="zoomOut" type="button"
            aria-label="縮小">−</button>
    <span id="zoomLabel">100%</span>
    <button id="zoomIn" type="button"
            aria-label="拡大">＋</button>
    <button id="fitBtn" type="button">画面に合わせる</button>
  </nav>

  <div id="status" role="status">パンフレットを読み込んでいます…</div>

  <script type="module">
    import * as pdfjsLib from
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs";

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs";

    const PDF_URL = "./pamphlet.pdf";

    const viewer = document.getElementById("viewer");
    const canvas = document.getElementById("pdfCanvas");
    const ctx = canvas.getContext("2d");

    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const pageInput = document.getElementById("pageInput");
    const pageTotal = document.getElementById("pageTotal");
    const zoomLabel = document.getElementById("zoomLabel");
    const status = document.getElementById("status");

    let pdf = null;
    let pageNumber = 1;
    let zoom = 1;
    let rendering = false;
    let renderAgain = false;

    function updateControls() {
      pageInput.value = pageNumber;
      pageTotal.textContent = "/ " + (pdf ? pdf.numPages : "--");
      prevBtn.disabled = pageNumber <= 1;
      nextBtn.disabled = !pdf || pageNumber >= pdf.numPages;
      zoomLabel.textContent = Math.round(zoom * 100) + "%";
    }

    async function renderPage() {
      if (!pdf) return;

      if (rendering) {
        renderAgain = true;
        return;
      }

      rendering = true;

      try {
        const page = await pdf.getPage(pageNumber);
        const baseViewport = page.getViewport({ scale: 1 });

        // 初期表示はページ全体が画面幅に収まるサイズ
        const fitScale = Math.min(
          (viewer.clientWidth - 8) / baseViewport.width,
          (viewer.clientHeight - 8) / baseViewport.height
        );

        const scale = Math.max(0.2, fitScale * zoom);
        const viewport = page.getViewport({ scale });

        // 高解像度のスマホ画面にも対応
        const outputScale = Math.min(
          window.devicePixelRatio || 1, 2
        );

        canvas.width = Math.floor(
          viewport.width * outputScale
        );
        canvas.height = Math.floor(
          viewport.height * outputScale
        );

        canvas.style.width = Math.floor(viewport.width) + "px";
        canvas.style.height = Math.floor(viewport.height) + "px";

        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        await page.render({
          canvasContext: ctx,
          viewport,
          transform: [
            outputScale, 0, 0,
            outputScale, 0, 0
          ]
        }).promise;

        status.textContent = "";
        updateControls();
      } catch (error) {
        console.error(error);
        status.textContent =
          "ページを表示できません。通信環境やPDFファイルを確認してください。";
      } finally {
        rendering = false;

        if (renderAgain) {
          renderAgain = false;
          renderPage();
        }
      }
    }

    function changePage(nextPage) {
      if (!pdf) return;

      pageNumber = Math.max(
        1, Math.min(pdf.numPages, nextPage)
      );

      viewer.scrollTop = 0;
      viewer.scrollLeft = 0;
      updateControls();
      renderPage();
    }

    prevBtn.addEventListener("click", () => {
      changePage(pageNumber - 1);
    });

    nextBtn.addEventListener("click", () => {
      changePage(pageNumber + 1);
    });

    pageInput.addEventListener("change", () => {
      changePage(Number(pageInput.value) || 1);
    });

    document.getElementById("zoomIn").addEventListener(
      "click", () => {
        zoom = Math.min(3, zoom + 0.25);
        renderPage();
      }
    );

    document.getElementById("zoomOut").addEventListener(
      "click", () => {
        zoom = Math.max(0.5, zoom - 0.25);
        renderPage();
      }
    );

    document.getElementById("fitBtn").addEventListener(
      "click", () => {
        zoom = 1;
        viewer.scrollTop = 0;
        viewer.scrollLeft = 0;
        renderPage();
      }
    );

    // 左右の矢印キーでもページ移動
    document.addEventListener("keydown", (event) => {
      if (event.target === pageInput) return;

      if (event.key === "ArrowLeft") {
        changePage(pageNumber - 1);
      } else if (event.key === "ArrowRight") {
        changePage(pageNumber + 1);
      }
    });

    // 画面の向きやサイズが変わったら再表示
    let resizeTimer;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(renderPage, 200);
    });

    try {

const loadingTask = pdfjsLib.getDocument({
  url: PDF_URL,
  cMapUrl: "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/cmaps/",
  cMapPacked: true,
  standardFontDataUrl: "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/standard_fonts/"
});

      pdf = await loadingTask.promise;

      pageInput.max = pdf.numPages;
      updateControls();
      await renderPage();
    } catch (error) {
      console.error(error);
      status.textContent =
        "PDFを読み込めません。pamphlet.pdf の名前と配置を確認してください。";
    }
  </script>
</body>
</html>
